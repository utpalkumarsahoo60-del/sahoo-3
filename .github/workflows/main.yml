name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin' 
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '11'

    - name: Build with Gradle
      run: ./gradlew build
